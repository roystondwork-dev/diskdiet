version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools", "/app"]
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    ignore:
      # svelte-check and the Svelte tooling support TypeScript 5 only; revisit
      # when they support 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      app-npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
    ignore:
      # Must match the minimum VS Code in engines.vscode (vsce rejects newer types).
      - dependency-name: "@types/vscode"
      # Must match the Node.js major that VS Code's extension host runs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript 5 and 6 only; revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vscode-npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

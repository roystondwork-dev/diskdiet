version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools", "/app"]
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    groups:
      app-npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

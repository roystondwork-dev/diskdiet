name: Release

# release-please keeps a release PR up to date from Conventional Commits on main.
# Merging it tags the release; GoReleaser then builds and uploads the assets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish artifacts for, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # keyless cosign signing + provenance
      attestations: write  # SLSA build provenance
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Decide which publishers to run
        id: skip
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_SUBMIT: ${{ vars.WINGET_SUBMIT }}
        run: |
          skip=""
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping Homebrew and Scoop publishing"
            skip="homebrew,scoop"
          fi
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_GITHUB_TOKEN is not set; skipping the winget submission"
            skip="${skip:+$skip,}winget"
          elif [ "$WINGET_SUBMIT" != "true" ]; then
            echo "::notice::winget submissions are paused (repository variable WINGET_SUBMIT is not \"true\")"
            skip="${skip:+$skip,}winget"
          fi
          if [ -n "$skip" ]; then echo "args=--skip=$skip" >> "$GITHUB_OUTPUT"; fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean ${{ steps.skip.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

  packages:
    # npm (`npx diskdiet`), PyPI (`pipx install diskdiet`) and the MCP Registry.
    # All three log in with GitHub OIDC: no tokens are stored. Each step may fail
    # (e.g. trusted publishing not set up yet) without failing the release.
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true' && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # trusted publishing to npm and PyPI; MCP Registry login
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -D "$RUNNER_TEMP/assets" -p checksums.txt -p checksums.txt.sigstore.json -p 'diskdiet_*.tar.gz' -p 'diskdiet_*.zip'
          # The binaries go into the wheels and the npm checksums, so check they are the signed release's.
          cosign verify-blob "$RUNNER_TEMP/assets/checksums.txt" \
            --bundle "$RUNNER_TEMP/assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Build the wheels
        run: python3 packaging/pypi/build_wheels.py "${TAG#v}" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/wheels"
      - name: Publish to PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/wheels
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        id: npm
        continue-on-error: true
        working-directory: packaging/npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::packaging/npm/package.json has $version, expected ${TAG#v} (release-please keeps them in sync)"
            exit 1
          fi
          node scripts/checksums.js "$version" "$RUNNER_TEMP/assets/checksums.txt"
          npm test
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
          npm publish --access public
      # The MCP Registry lists `npx diskdiet mcp`; it checks server.json against
      # the npm package's mcpName, so it runs after npm.
      - name: Publish to the MCP Registry
        if: steps.npm.outcome == 'success'
        continue-on-error: true
        run: scripts/mcp-publish.sh

  vscode:
    needs: [release-please, goreleaser]
    if: always() && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the VSIX to the release
      id-token: write      # provenance
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: npm ci
      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -D "$RUNNER_TEMP/assets" -p checksums.txt -p checksums.txt.sigstore.json -p 'diskdiet_*.tar.gz' -p 'diskdiet_*.zip'
          # The binaries go into the extension, so check they are the signed release's.
          cosign verify-blob "$RUNNER_TEMP/assets/checksums.txt" \
            --bundle "$RUNNER_TEMP/assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Package the VSIX (diskdiet for every platform inside)
        run: scripts/package-release.sh "${TAG#v}" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/vsix"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/vsix/*.vsix
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/vsix/*.vsix --clobber
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; skipping the VS Code Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath "$RUNNER_TEMP"/vsix/*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; skipping Open VSX"
            exit 0
          fi
          # The namespace must exist and match the publisher; creating it again fails harmlessly.
          npx ovsx create-namespace "$(node -p 'require("./package.json").publisher')" || true
          npx ovsx publish "$RUNNER_TEMP"/vsix/*.vsix

  app:
    needs: [release-please, goreleaser]
    if: >-
      always() && needs.goreleaser.result == 'success'
    uses: ./.github/workflows/app.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write

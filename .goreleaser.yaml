# GoReleaser configuration. Docs: https://goreleaser.com
# Local dry run: make snapshot
version: 2

project_name: diskdiet

before:
  hooks:
    - go mod download
    - ./scripts/release-assets.sh

builds:
  - id: diskdiet
    main: ./cmd/diskdiet
    binary: diskdiet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/roystondwork-dev/diskdiet/internal/buildinfo.version={{ .Version }}
      - -X github.com/roystondwork-dev/diskdiet/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/roystondwork-dev/diskdiet/internal/buildinfo.date={{ .CommitDate }}
    # Reproducible builds: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (requires syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with Sigstore (GitHub OIDC).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

nfpms:
  - id: packages
    package_name: diskdiet
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: diskdiet contributors
    homepage: https://github.com/roystondwork-dev/diskdiet
    maintainer: Royston D <roystondwork-dev@users.noreply.github.com>
    description: See where your developer disk space went (npm, Yarn, pnpm, Bun, Docker, node_modules) and get it back safely.
    license: MIT
    section: utils
    formats: [deb, rpm, apk]
    contents:
      - src: completions/diskdiet.bash
        dst: /usr/share/bash-completion/completions/diskdiet
      - src: completions/diskdiet.zsh
        dst: /usr/share/zsh/site-functions/_diskdiet
      - src: completions/diskdiet.fish
        dst: /usr/share/fish/vendor_completions.d/diskdiet.fish

homebrew_casks:
  - name: diskdiet
    repository:
      owner: roystondwork-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/roystondwork-dev/diskdiet
    description: See where your developer disk space went and get it back safely
    license: MIT
    commit_author:
      name: diskdiet-release-bot
      email: roystondwork-dev@users.noreply.github.com
    completions:
      bash: completions/diskdiet.bash
      zsh: completions/diskdiet.zsh
      fish: completions/diskdiet.fish
    # Binaries are not notarized by Apple; clear the quarantine flag on install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/diskdiet"]
          end

scoops:
  - name: diskdiet
    repository:
      owner: roystondwork-dev
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/roystondwork-dev/diskdiet
    description: See where your developer disk space went and get it back safely.
    license: MIT
    commit_author:
      name: diskdiet-release-bot
      email: roystondwork-dev@users.noreply.github.com

release:
  github:
    owner: roystondwork-dev
    name: diskdiet
  # release-please creates the release with curated notes; GoReleaser only adds assets.
  mode: keep-existing
  prerelease: auto

changelog:
  disable: true

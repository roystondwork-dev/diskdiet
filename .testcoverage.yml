# Coverage gate enforced by `make cover` and CI.
profile: coverage.out

threshold:
  file: 70
  package: 85
  total: 90

exclude:
  paths:
    # main() only wires os.Exit around cli.Execute, which is tested directly.
    - ^cmd/diskdiet/main\.go$
    # The docs generator is not shipped code.
    - ^internal/cli/gendocs/
    # Third-party npm packages can contain Go files (only present locally).
    - node_modules/

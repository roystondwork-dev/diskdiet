# Codecov settings. The authoritative coverage gate is .testcoverage.yml,
# enforced in CI; Codecov provides the dashboard, badge and PR comments.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        target: 90%
        threshold: 0.5%
    patch:
      default:
        target: 85%

# Go coverage profiles use import paths; map them to repository paths.
fixes:
  - "github.com/roystondwork-dev/diskdiet/::"

# Keep in sync with the exclusions in .testcoverage.yml.
ignore:
  - cmd/diskdiet/main.go
  - internal/cli/gendocs
  - app
  - extensions
  - packaging

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
